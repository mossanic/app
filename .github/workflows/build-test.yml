name: Build Test APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # --- CACHE 1: Gradle ---
    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    # --- CACHE 2: Rust & Cargo ---
    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: rust-${{ runner.os }}-

    # --- CACHE 3: Android NDK ---
    - name: Cache NDK
      id: cache-ndk
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        key: ndk-26.1.10909125-${{ runner.os }}

    - name: Install NDK and accept licenses
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: |
        export SDKMANAGER_DIR=$(find $ANDROID_HOME -name sdkmanager -exec dirname {} \; | head -n 1)
        export PATH=$SDKMANAGER_DIR:$PATH
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "ndk;26.1.10909125"
        
    - name: Set NDK Env Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: |
        # Only install if not cached
        if ! command -v cargo-ndk &> /dev/null; then
          cargo install cargo-ndk
        fi

    - name: Install Shaderc
      run: |
        sudo apt-get update
        sudo apt-get install -y libshaderc-dev

    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: mossanic-spike-apk
        path: app/build/outputs/apk/debug/app-debug.apk
