[package]
name = "mossanic-renderer"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "0.38", features = ["loaded"] }
jni = "0.21"
ndk = "0.9"
log = "0.4"
android_logger = "0.14"
once_cell = "1.20"
swash = "0.1.18"
bytemuck = { version = "1.14", features = ["derive"] }

[build-dependencies]
shaderc = "0.8"
