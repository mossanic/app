[package]
name = "mossanic-renderer"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
raw-window-handle = "0.6"
android-raw-window = "0.1"
jni = "0.21"
ndk = "0.9"
log = "0.4"
android_logger = "0.14"
once_cell = "1.20"
bytemuck = { version = "1.14", features = ["derive"] }

# Text Rendering
skrifa = "0.22"
zeno = "0.3"

[build-dependencies]
shaderc = "0.9"
